# verified: workflow scope push test
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (csc / .NET Framework 4.8)
        shell: pwsh
        run: ./build.ps1

      - name: Verify scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) {
              $bad++
              Write-Host "::error file=$($_.Name)::$($errs[0].Message)"
            }
          }
          if ($bad -gt 0) { throw "有 $bad 个脚本存在语法错误" }
          Write-Host "所有脚本语法通过"

      - name: Package
        shell: pwsh
        run: |
          $version = 'dev'
          if ($env:GITHUB_REF -match '^refs/tags/(.+)$') { $version = $Matches[1] }
          $pkg = 'dist/pkg'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist\GitHubDownloader.exe $pkg\
          Copy-Item -Recurse dist\scripts $pkg\scripts
          Copy-Item README.md, LICENSE $pkg\
          $zip = "dist\GitHubDownloader-$version-win-x64.zip"
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -Force
          Write-Host "packaged: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHubDownloader-win-x64
          path: |
            dist\GitHubDownloader.exe
            dist\GitHubDownloader-*-win-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\GitHubDownloader.exe
            dist\GitHubDownloader-*-win-x64.zip
          generate_release_notes: true
